<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desktop</title>
    <style>
      :root {
        color-scheme: dark;
        background: #000;
        color: #fff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: auto;
        background: #000;
      }
      pre {
        margin: 0;
        padding: 24px;
        font-family: monospace;
        font-size: clamp(8px, 1.5vw, 16px);
        font-weight: 700;
        line-height: 1.15;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <pre aria-label="Desktop"> </pre>
  </body>
</html>
