# Software-rendered remote desktop: round frames without animation or blur.
backend = "xrender";
vsync = false;
shadow = false;
fading = false;
corner-radius = 12;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "fullscreen",
  "_NET_WM_STATE@[*]:32a = '_NET_WM_STATE_MAXIMIZED_VERT' && _NET_WM_STATE@[*]:32a = '_NET_WM_STATE_MAXIMIZED_HORZ'"
];
