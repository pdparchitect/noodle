<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Colour field</title><style>*{box-sizing:border-box}body{margin:0;background:#111;color:#faf5e9;font:13px system-ui;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%}main{position:relative;padding:44px;pointer-events:none;min-height:100vh;display:flex;flex-direction:column;justify-content:space-between}h1{font-size:52px;letter-spacing:-3px;font-weight:400;margin:12px 0}small{letter-spacing:3px;font-size:10px}p{opacity:.7}footer{display:flex;align-items:center;gap:12px;pointer-events:auto}button{padding:13px 20px;border:1px solid #ffffff50;border-radius:30px;color:white;background:#ffffff10;backdrop-filter:blur(15px);cursor:pointer}input{width:150px;accent-color:#fff}.value{font:11px monospace;opacity:.7;margin-left:auto}</style><canvas id="field"></canvas><main><header><small>AN EXPERIMENT IN LIGHT</small><h1>Colour field.</h1><p>Move slowly. See what happens.</p></header><footer><button id="shuffle">New palette</button><input id="hue" aria-label="Hue" type="range" min="0" max="360" value="260"><button id="save">Save palette</button><span class="value" id="value"></span></footer></main><script>const c=document.querySelector('canvas'),ctx=c.getContext('2d'),slider=document.querySelector('#hue');let hue=260,x=.6,y=.4;const draw=()=>{c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;ctx.fillStyle=`hsl(${hue},45%,10%)`;ctx.fillRect(0,0,c.width,c.height);for(let i=0;i<3;i++){const g=ctx.createRadialGradient(c.width*(i===0?x:1-x),c.height*(i===1?y:1-y),0,c.width*x,c.height*y,c.width*.9);g.addColorStop(0,`hsla(${(hue+i*65)%360},80%,65%,.7)`);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(0,0,c.width,c.height);}document.querySelector('#value').textContent=`HUE ${hue}°`;};window.onresize=draw;window.onpointermove=e=>{x=e.clientX/innerWidth;y=e.clientY/innerHeight;draw();};slider.oninput=()=>{hue=+slider.value;draw();};document.querySelector('#shuffle').onclick=()=>{hue=(hue+137)%360;slider.value=hue;draw();console.log('Palette',hue);};document.querySelector('#save').onclick=async()=>{await noodle.storage.set('palette',{hue});document.querySelector('#save').textContent='Saved';};noodle.storage.get('palette').then(p=>{if(p){hue=p.hue;slider.value=hue;}draw();});draw();</script></html>
