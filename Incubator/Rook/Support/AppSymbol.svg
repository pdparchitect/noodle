<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" data-icon-background="rook" role="img" aria-labelledby="title">
  <title id="title">Rook symbol</title>
  <!-- Drawn as Pion's pawn is: flat parts parted by seams, on the pawn's own body curve and base, and the same as
       the rook in the app's agent marks. -->
  <defs>
    <!-- Ivory, a shade deeper toward the base, as if lit from above. -->
    <linearGradient id="symbol-shade" gradientUnits="userSpaceOnUse" x1="0" y1="230" x2="0" y2="1020">
      <stop offset="0" stop-color="#fbf9f2"/>
      <stop offset="1" stop-color="#e2dccb"/>
    </linearGradient>
  </defs>
  <g id="symbol" fill="url(#symbol-shade)" fill-rule="evenodd">
    <!-- Battlements: three merlons over one band. -->
    <path d="M450,300 H540 V370 H582 V300 H672 V370 H714 V300 H804 V520 H450 Z"/>
    <!-- Collar. -->
    <path d="M472,540 H782 A22,22 0 0 1 804,562 V578 A22,22 0 0 1 782,600 H472 A22,22 0 0 1 450,578 V562 A22,22 0 0 1 472,540 Z"/>
    <!-- Body, flaring to the base as the pawn's does. -->
    <path d="M507,620 H747 C749,728 742,790 812,872 H442 C512,790 505,728 507,620 Z"/>
    <!-- The pawn's base. -->
    <path d="M412,896 H842 A46,46 0 0 1 888,942 V972 A46,46 0 0 1 842,1018 H412 A46,46 0 0 1 366,972 V942 A46,46 0 0 1 412,896 Z"/>
  </g>
</svg>
