<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Noodle is a native macOS workspace for you and your AI agents. Work with an agent individually or bring a team together around a shared goal." />
    <title>Noodle — A workspace for you and your AI agents</title>
    <link rel="icon" type="image/png" href="./assets/noodle.png" />
    <link rel="stylesheet" href="./styles.css?v=20260915-4" />
    <link rel="stylesheet" href="./dark.css?v=1" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="site-nav">
        <div class="brand">
          <img src="./assets/noodle.png" width="28" height="28" alt="" />
          <span>Noodle</span>
        </div>
        <nav class="header-links" aria-label="Site">
          <a class="source-link" href="./">Light version</a>
          <a class="source-link" href="https://github.com/pdparchitect/noodle">
            GitHub
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M4 12 12 4M4 4h8v8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </a>
        </nav>
      </div>
    </header>

    <main id="main" tabindex="-1">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-copy wrap">
          <p class="platform">Noodle for Mac</p>
          <h1 id="hero-title">A workspace for you.<br />And your AI agents.</h1>
          <div class="actions">
            <a class="button" href="https://github.com/pdparchitect/noodle/releases/latest/download/Noodle-arm64.zip">Download for Mac</a>
          </div>
          <p class="requirements">macOS 15 or later <span aria-hidden="true">·</span> Apple silicon</p>
        </div>

        <figure class="macbook">
          <img class="macbook-hardware" src="./assets/macbook-dark.jpg" width="1536" height="1024" alt="" fetchpriority="high" />
          <div class="macbook-display">
            <img src="./assets/workspace.png" width="1490" height="1083" alt="Noodle running on a MacBook Pro, showing the agent sidebar and a conversation with shared work." fetchpriority="high" />
          </div>
        </figure>
      </section>
    </main>

    <svg class="display-mask" width="0" height="0" aria-hidden="true" focusable="false">
      <defs>
        <clipPath id="macbook-screen" clipPathUnits="objectBoundingBox">
          <path d="M .012 0 H .442 Q .445 0 .445 .004 V .020 Q .445 .028 .451 .028 H .549 Q .555 .028 .555 .020 V .004 Q .555 0 .558 0 H .988 Q 1 0 1 .020 V 1 H 0 V .020 Q 0 0 .012 0 Z" />
        </clipPath>
      </defs>
    </svg>
