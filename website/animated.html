        function render(p) {
          const reduced = motion.matches;
          const turn = smooth(0, .34, p);
          const opening = smooth(.30, .86, p);
          const settle = smooth(.36, .9, p);
          const cameraX = mix(mix(20, 80, turn), 72, settle);
          const cameraY = mix(-22, 0, turn);
          const cameraZ = mix(-13, 0, turn);
          const hinge = mix(0, 104, opening);
          const reveal = smooth(.45, .87, p);
          const arrival = smooth(.72, .92, p);
          const opacity = reduced || !canAnimate ? 1 : smooth(.88, 1, p);
          const cueOpacity = reduced || !canAnimate ? 0 : 1 - smooth(.01, .08, p);
          // Start with only the device. Make room for the final headline as
          // the lid settles, then reveal the copy and download action together.
          const top = mix(34, copyBottom + 24, arrival);
          const bottom = height - 34 - 54 * cueOpacity;
          const availableHeight = Math.max(60, bottom - top);
          // Cap the projected silhouette, including perspective, on large displays.
          const availableWidth = Math.min(960, width * (width < 735 ? .90 : .87));
          const points = corners(cameraX, cameraY, cameraZ, hinge);
          let lo = .03, hi = 1.3;
          for (let i = 0; i < 18; i++) {
            const scale = (lo + hi) / 2, box = bounds(points, scale);
            if (box.width > availableWidth || box.height > availableHeight) hi = scale;
            else lo = scale;
          }
          // Keep the closed-to-edge turn at a stable size; open poses can grow.
          const scale = Math.min(lo, mix(width < 735 ? .46 : .83, 1.3, smooth(.34, .80, p)));
          const box = bounds(points, scale);
          const y = (top + bottom - box.top - box.bottom) / 2;
          const properties = {
            '--camera-x': cameraX + 'deg', '--camera-y': cameraY + 'deg', '--camera-z': cameraZ + 'deg',
            '--lid-angle': hinge + 'deg', '--scale': scale,
            '--offset-x': -(box.left + box.right) / 2 + 'px', '--offset-y': y + 'px',
            '--screen-on': reveal * mix(.3, 1, reveal), '--glass-opacity': 1 - reveal
          };
          for (const [name, value] of Object.entries(properties)) laptop.style.setProperty(name, value);
          stage.style.setProperty('--content-opacity', opacity);
          stage.style.setProperty('--content-visibility', opacity > 0 ? 'visible' : 'hidden');
          stage.style.setProperty('--cue-opacity', cueOpacity);
          stage.style.setProperty('--cue-visibility', cueOpacity > 0 ? 'visible' : 'hidden');
          stage.style.setProperty('--cue-animation', cueOpacity > 0 ? 'running' : 'paused');
          copy.style.setProperty('--copy-y', (1 - opacity) * 12 + 'px');
          ground.style.setProperty('--shadow-width', box.width * .86 + 'px');
          ground.style.setProperty('--shadow-y', y + box.bottom + 6 + 'px');
          story.dataset.progress = p.toFixed(4);
        }
        function tick(time) {
          const dt = previousTime ? Math.min(time - previousTime, 64) : 16;
          previousTime = time;
          current += (target - current) * (1 - Math.exp(-dt / 65));
          if (Math.abs(target - current) < .0001) current = target;
          render(current);
          if (current !== target) frame = requestAnimationFrame(tick);
          else { frame = 0; previousTime = 0; }
        }
        function onScroll() {
          target = motion.matches || !canAnimate ? 1 : clamp((scrollY - storyTop) / travel);
          if (!frame) frame = requestAnimationFrame(tick);
        }
        function measure() {
          story.classList.toggle('is-static', !canAnimate);
          story.classList.toggle('is-animated', !motion.matches && canAnimate);
          width = stage.clientWidth;
          height = stage.clientHeight;
          storyTop = story.getBoundingClientRect().top + scrollY;
          travel = Math.max(1, story.offsetHeight - height);
          // offsetTop/offsetHeight exclude the animated copy translation.
          copyBottom = copy.offsetTop + copy.offsetHeight;
          target = motion.matches || !canAnimate ? 1 : clamp((scrollY - storyTop) / travel);
          current = target;
          render(current);
        }
        addEventListener('scroll', onScroll, { passive: true });
        addEventListener('resize', measure, { passive: true });
        addEventListener('pageshow', measure);
        motion.addEventListener('change', measure);
        measure();
      })();
    </script>
  </body>
</html>
