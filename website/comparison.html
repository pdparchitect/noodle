<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <title>Noodle — MacBook comparison</title>
  <link rel="icon" href="./assets/noodle.png" />
  <style>
    :root { color-scheme: dark; color: #f5f5f7; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100svh; display: flex; flex-direction: column; user-select: none; -webkit-user-select: none; }
    header { padding: 20px 28px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    h1 { margin: 0; font-size: 18px; font-weight: 600; }
    a { color: #a1a1a6; font-size: 13px; text-decoration: none; }
    a:hover { color: #fff; }
    .panes { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; }
    section { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
    section + section { border-left: 1px solid #1d1d1f; }
    h2 { margin: 0; padding: 10px 28px; font-size: 14px; font-weight: 500; }
    h2 a { color: #f5f5f7; font-size: inherit; }
    iframe { display: block; width: 100%; flex: 1; min-height: 0; border: 0; pointer-events: none; }
    .controls { display: flex; align-items: center; gap: 20px; margin: 0 auto; width: min(660px, 100%); padding: 20px 28px 28px; }
    button { border: 0; background: #1d1d1f; color: #f5f5f7; padding: 10px 18px; border-radius: 20px; font: inherit; font-size: 12px; cursor: pointer; }
    button:disabled, input:disabled { opacity: .4; cursor: default; }
    input { flex: 1; min-width: 0; accent-color: #2997ff; }
    :focus-visible { outline: 2px solid #2997ff; outline-offset: 4px; }
    @media (max-width: 700px) { .panes { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } section + section { border-left: 0; border-top: 1px solid #1d1d1f; } header { padding: 16px 20px; } h1 { font-size: 16px; } h2 { padding: 8px 20px; } .controls { gap: 12px; padding: 16px 20px; } }
  </style>
</head>
<body>
  <header><h1>MacBook comparison</h1><a href="./animated.html">Back to Noodle</a></header>
  <main class="panes">
    <section aria-labelledby="css-title"><h2 id="css-title"><a href="./animated.html">CSS version ↗</a></h2><iframe src="./animated.html" title="CSS MacBook" tabindex="-1"></iframe></section>
    <section aria-labelledby="model-title"><h2 id="model-title"><a href="./model.html">3D model ↗</a></h2><iframe src="./model.html" title="Supplied 3D MacBook model" tabindex="-1"></iframe></section>
  </main>
  <div class="controls"><button type="button" data-progress="0">Closed</button><input type="range" min="0" max="1000" value="1000" aria-label="Laptop opening progress" /><button type="button" data-progress="1000">Open</button></div>
  <script>
    const frames = [...document.querySelectorAll('iframe')];
    const slider = document.querySelector('input');
    function sync() {
      for (const frame of frames) {
        const document = frame.contentDocument;
        if (!document?.querySelector('.story')) continue;
        const travel = Math.max(0, document.documentElement.scrollHeight - frame.clientHeight);
        frame.contentWindow.scrollTo(0, travel * Number(slider.value) / 1000);
      }
    }
    for (const frame of frames) {
      frame.addEventListener('load', () => {
        const style = frame.contentDocument.createElement('style');
        style.textContent = '.site-header, .hero-copy, .skip-link, .scroll-cue { display: none; } html { scrollbar-width: none; }';
        frame.contentDocument.head.append(style);
        function ready() { frame.contentWindow.dispatchEvent(new Event('resize')); sync(); }
        const story = frame.contentDocument.querySelector('.story');
        if (!story) return;
        ready();
      });
    }
    addEventListener('message', event => {
      if (event.origin !== location.origin || event.data?.type !== 'noodle-model-ready') return;
      const frame = frames.find(item => item.contentWindow === event.source);
      if (frame) { frame.contentWindow.dispatchEvent(new Event('resize')); sync(); }
    });
    slider.addEventListener('input', sync);
    for (const button of document.querySelectorAll('button')) button.addEventListener('click', () => { slider.value = button.dataset.progress; sync(); });
    addEventListener('resize', sync, { passive: true });
    const motion = matchMedia('(prefers-reduced-motion: reduce)');
    function updateMotion() {
      slider.disabled = motion.matches;
      document.querySelector('[data-progress="0"]').disabled = motion.matches;
      if (motion.matches) { slider.value = '1000'; sync(); }
    }
    motion.addEventListener('change', updateMotion);
    updateMotion();
  </script>
</body>
</html>
