<tspan x="55.211217963922536" dy="25.0" textLength="561" lengthAdjust="spacingAndGlyphs"> /Applications/ChatGPT.app/Contents/Resources/codex</tspan>
<tspan x="55.211217963922536" dy="25.0" textLength="242" lengthAdjust="spacingAndGlyphs">claude has the same!!!</tspan>
</text>
<text x="1623.551721197" y="483.004887204584" fill="#1e1e1e" font-family="Menlo, monospace" font-size="37.2044937413552">
<tspan x="1623.551721197" dy="0" textLength="736.6489760788326" lengthAdjust="spacingAndGlyphs">ONE AGENT PROCESS FOR AGENT INSTANCE</tspan>
<tspan x="1623.551721197" dy="46.505617176694" textLength="757.111447636578" lengthAdjust="spacingAndGlyphs">SO THAT IF I HAVE 2 AGENT AND 2 GORUP</tspan>
<tspan x="1623.551721197" dy="46.505617176694" textLength="634.3366182901058" lengthAdjust="spacingAndGlyphs">CHATS THAT IS 2 AGENT PROCESSES</tspan>
<tspan x="1623.551721197" dy="46.505617176694" ></tspan>
<tspan x="1623.551721197" dy="46.505617176694" textLength="716.1865045210873" lengthAdjust="spacingAndGlyphs">THE AGENT IS SIMPLY ABLE TO SEE ITS</tspan>
<tspan x="1623.551721197" dy="46.505617176694" textLength="818.498862309814" lengthAdjust="spacingAndGlyphs">MESSAGES AND WE ARE SIMPLY COMMUNICATION</tspan>
<tspan x="1623.551721197" dy="46.505617176694" textLength="511.56178894363376" lengthAdjust="spacingAndGlyphs">THE NOTIFICATIONS VIA ACP</tspan>
</text>
