<text x="1548.0491242306307" y="1578.0406001614508" fill="#1e1e1e" font-family="Menlo, monospace" font-size="26.180591030974746">
<tspan x="1548.0491242306307" dy="0" textLength="619.1564331054688" lengthAdjust="spacingAndGlyphs">THE APP SHOULD BE ABLE TO MANAGE THE SKILLS</tspan>
