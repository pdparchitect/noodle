name: Build Noodle Terminal for Windows

# The `noodle` command for Windows, one ZIP for each processor: prepared for each release, and built on
# pull requests that touch it so both processors are known to build before one is merged.
on:
  workflow_call:
  pull_request:
    paths:
      - 'Terminal/**'
      - 'Shared/HubLink/**'
      - 'Shared/Surface/**'
      - 'Push/Wire/**'
      - 'scripts/package-terminal-windows-release.ps1'
      - '.github/workflows/terminal-windows.yml'

permissions:
  contents: read

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-11-arm, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The swift.org toolchain with the Swift 6.4 SwiftTUI needs; the image's Visual Studio provides the Windows SDK.
      - name: Install Swift
        shell: pwsh
        run: |
          $suffix = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { '-arm64' } else { '' }
          $installer = "$env:RUNNER_TEMP\swift.exe"
          Invoke-WebRequest "https://download.swift.org/swift-6.4.1-release/windows10$suffix/swift-6.4.1-RELEASE/swift-6.4.1-RELEASE-windows10$suffix.exe" -OutFile $installer
          Start-Process -Wait -FilePath $installer -ArgumentList '/quiet', '/norestart'
          $swift = "$env:LOCALAPPDATA\Programs\Swift"
          Add-Content $env:GITHUB_PATH "$swift\Toolchains\6.4.1+Asserts\usr\bin"
          Add-Content $env:GITHUB_PATH "$swift\Runtimes\6.4.1\usr\bin"
          Add-Content $env:GITHUB_ENV "SDKROOT=$swift\Platforms\6.4.1\Windows.platform\Developer\SDKs\Windows.sdk"

      - name: Build and pack
        shell: pwsh
        run: ./scripts/package-terminal-windows-release.ps1

      - uses: actions/upload-artifact@v6
        with:
          name: terminal-release-windows-${{ matrix.runner }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
