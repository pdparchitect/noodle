name: Prepare Noodle Mobile release

on:
  workflow_call:

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Validate release notes
        shell: zsh {0}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < Mobile/VERSION)"
          [[ "$version" =~ '^[0-9]+\.[0-9]+\.[0-9]+$' ]]
          python3 scripts/release-versions.py notes mobile > /dev/null
          print "MOBILE_VERSION=$version" >> "$GITHUB_ENV"

      # The export signs with Apple's cloud-managed distribution certificate, which the Admin key may use.
      - name: Archive and export for App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          # App Store Connect refuses a build number it has seen, so every run and retry gets its own.
          MOBILE_BUILD: ${{ github.run_number }}.${{ github.run_attempt }}
        shell: zsh {0}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/mobile-signing.p8"
          trap 'rm -f "$key"' EXIT
          print -rn -- "${APP_STORE_CONNECT_API_KEY_P8:?Missing App Store Connect key}" > "$key"
          APPLE_API_KEY_PATH="$key" APPLE_API_KEY_ID="$APP_STORE_CONNECT_KEY_ID" \
            APPLE_API_ISSUER_ID="$APP_STORE_CONNECT_ISSUER_ID" \
            zsh scripts/mobile.sh package "$MOBILE_VERSION" "$MOBILE_BUILD" "dist/mobile-$MOBILE_VERSION"

      - uses: actions/upload-artifact@v6
        with:
          name: mobile-release-assets
          path: dist/mobile-${{ env.MOBILE_VERSION }}/
          if-no-files-found: error
          retention-days: 7
