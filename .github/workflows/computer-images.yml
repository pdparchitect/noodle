name: Prepare Noodle Computer images

on:
  pull_request:
    paths:
      - 'Computer/Images/**'
      - '.github/workflows/computer-images.yml'
      - '!**.md'
      - 'Computer/Images/CHANGELOG.md'
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: docker/setup-buildx-action@v4
      - name: Validate image version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < Computer/Images/VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Build both ARM64 images
        env:
          IMAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -eu
          for kind in shell desktop; do
            docker buildx build --platform linux/arm64 --load \
              --build-arg IMAGE_VERSION="$IMAGE_VERSION" --build-arg SOURCE_REVISION="$GITHUB_SHA" \
              --tag "noodle-computer-$kind-image:check" --file "Computer/Images/$kind/Dockerfile" Computer/Images
          done
      - name: Verify both image contracts without networking or host mounts
        run: |
          set -eu
          for kind in shell desktop; do
            docker run --rm --network none --entrypoint /bin/sh "noodle-computer-$kind-image:check" /usr/local/lib/noodle-image-check "$kind"
          done
      - name: Verify interactive welcome in both images
        run: python3 Computer/Images/tests/welcome.py docker noodle-computer-shell-image:check noodle-computer-desktop-image:check
      - name: Verify desktop wallpaper rendering
        run: docker run --rm -i --network none --entrypoint /bin/sh noodle-computer-desktop-image:check < Computer/Images/tests/desktop.sh
      # Export the exact tested builds. Publication loads these; it never rebuilds.
      - name: Save tested images
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          docker save noodle-computer-shell-image:check noodle-computer-desktop-image:check | gzip > computer-images.tar.gz
          shasum -a 256 computer-images.tar.gz > computer-images.tar.gz.sha256
      - uses: actions/upload-artifact@v6
        if: github.event_name != 'pull_request'
        with:
          name: computer-image-builds
          path: |
            computer-images.tar.gz
            computer-images.tar.gz.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
