name: Noodle Computer images

on:
  pull_request:
    paths: ['Computer/Images/**', '.github/workflows/computer-images.yml']
  push:
    tags: ['computer-images-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: computer-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate image version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < Computer/Images/VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_REF_NAME" == "computer-images-v$version" ]]
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Build both ARM64 images
        env:
          IMAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -eu
          for kind in shell desktop; do
            docker buildx build --platform linux/arm64 --load \
              --build-arg IMAGE_VERSION="$IMAGE_VERSION" --build-arg SOURCE_REVISION="$GITHUB_SHA" \
              --tag "noodle-computer-$kind-image:check" --file "Computer/Images/$kind/Dockerfile" Computer/Images
          done
      - name: Verify both image contracts without networking or host mounts
        run: |
          set -eu
          for kind in shell desktop; do
            docker run --rm --network none --entrypoint /bin/sh "noodle-computer-$kind-image:check" /usr/local/lib/noodle-image-check "$kind"
          done
      - name: Verify desktop wallpaper rendering
        run: docker run --rm -i --network none --entrypoint /bin/sh noodle-computer-desktop-image:check < Computer/Images/tests/desktop.sh
      - name: Sign in to GHCR for an approved image tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/computer-images-v') && github.repository == 'pdparchitect/noodle'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish versioned images and record immutable digests
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/computer-images-v') && github.repository == 'pdparchitect/noodle'
        env:
          IMAGE_VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          for kind in shell desktop; do
            image="ghcr.io/pdparchitect/noodle-computer-$kind-image:$IMAGE_VERSION"
            docker tag "noodle-computer-$kind-image:check" "$image"
            docker push "$image"
            digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$image")"
            [[ "$digest" == ghcr.io/pdparchitect/noodle-computer-"$kind"-image@sha256:* ]]
            echo "$kind=$digest" >> computer-image-digests.txt
            echo "$kind: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
          done
          echo 'Set both GHCR packages to Public and verify anonymous pulls before promoting app defaults.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/computer-images-v') && github.repository == 'pdparchitect/noodle'
        with:
          name: computer-image-digests
          path: computer-image-digests.txt
