name: Validate and release versions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Serialize the whole pipeline, including promotion of both update channels.
concurrency:
  group: versions-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow syntax and expressions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes=

  versions:
    runs-on: ubuntu-latest
    outputs:
      noodle: ${{ steps.versions.outputs.noodle }}
      computer: ${{ steps.versions.outputs.computer }}
      images: ${{ steps.versions.outputs.images }}
      any: ${{ steps.versions.outputs.any }}
      products: ${{ steps.versions.outputs.products }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: versions
        run: python3 scripts/release-versions.py plan
      - name: Require public distribution
        if: github.event_name != 'pull_request' && steps.versions.outputs.any == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = false

  checks:
    needs: workflow-lint
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Verify version automation and publication guards
        run: |
          python3 -m unittest discover -s Tests/ReleaseAutomation -v
          swift Computer/Tests/ReleaseWorkflowTests.swift "$PWD"
      - name: Test all application and integration packages
        run: |
          swift test --disable-sandbox
          swift test --disable-sandbox --package-path Computer --scratch-path .build/computer
          swift test --disable-sandbox --package-path Computer/Bridge

  prepare-noodle:
    needs: [versions, checks]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.versions.outputs.noodle == 'true'
    uses: ./.github/workflows/prepare-noodle-release.yml
    secrets: inherit

  prepare-computer:
    needs: [versions, checks]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.versions.outputs.computer == 'true'
    uses: ./.github/workflows/computer-release.yml
    secrets: inherit

  prepare-images:
    needs: [versions, checks]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.versions.outputs.images == 'true'
    uses: ./.github/workflows/computer-images.yml

  tag:
    needs: [versions, workflow-lint, checks, prepare-noodle, prepare-computer, prepare-images]
    # Explicitly accept unselected/skipped products, never a failed/cancelled build.
    if: >-
      always() && !cancelled() && github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' && needs.versions.outputs.any == 'true' &&
      needs.workflow-lint.result == 'success' &&
      needs.checks.result == 'success' &&
      (needs.versions.outputs.noodle != 'true' || needs.prepare-noodle.result == 'success') &&
      (needs.versions.outputs.computer != 'true' || needs.prepare-computer.result == 'success') &&
      (needs.versions.outputs.images != 'true' || needs.prepare-images.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mint tags from the checked VERSION files
        env:
          RELEASE_PRODUCTS: ${{ needs.versions.outputs.products }}
        run: |
          git fetch origin --tags
          python3 scripts/release-versions.py tag

  publish-images:
    needs: [versions, tag]
    if: needs.versions.outputs.images == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: computer-image-builds
      - name: Load the tested images
        run: |
          sha256sum -c computer-images.tar.gz.sha256
          docker load < computer-images.tar.gz
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and verify public versioned and latest images
        run: bash scripts/publish-computer-images.sh
      - uses: actions/upload-artifact@v4
        with:
          name: computer-image-digests
          path: computer-image-digests.txt
          if-no-files-found: error

  publish-computer:
    needs: [versions, tag, publish-images]
    if: >-
      always() && !cancelled() && needs.tag.result == 'success' &&
      needs.versions.outputs.computer == 'true' &&
      (needs.versions.outputs.images != 'true' || needs.publish-images.result == 'success')
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read Computer version
        run: echo "COMPUTER_VERSION=$(cat Computer/VERSION)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: computer-release-assets
          path: dist/computer-${{ env.COMPUTER_VERSION }}
      - name: Verify public image channel before releasing Computer
        run: python3 scripts/computer-image-registry.py channel
      - name: Publish the verified Computer archive and update channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "dist/computer-$COMPUTER_VERSION"
          shasum -a 256 -c "Noodle-Computer-$COMPUTER_VERSION-arm64.zip.sha256"
          cd ../..
          zsh scripts/publish-computer-release.sh "$COMPUTER_VERSION" "dist/computer-$COMPUTER_VERSION/release-notes.md"

  publish-noodle:
    needs: [versions, tag, publish-images, publish-computer]
    if: >-
      always() && !cancelled() && needs.tag.result == 'success' &&
      needs.versions.outputs.noodle == 'true' &&
      (needs.versions.outputs.images != 'true' || needs.publish-images.result == 'success') &&
      (needs.versions.outputs.computer != 'true' || needs.publish-computer.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: noodle-release-assets
          path: dist
      - name: Publish the verified Noodle archive and update channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          tag="v$version"
          cd dist
          sha256sum -c "Noodle-$version-macOS.zip.sha256"
          cd ..
          # Existing releases (including drafts) require recovery, never replacement.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists; inspect it before retrying." >&2
            exit 1
          fi
          gh release create "$tag" "dist/Noodle-$version-macOS.zip" \
            "dist/Noodle-$version-macOS.zip.sha256" dist/appcast.xml \
            --draft --verify-tag --notes-file dist/release-notes.md --title "Noodle $version"
          gh release edit "$tag" --draft=false --latest
