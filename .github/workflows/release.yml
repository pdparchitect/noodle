name: Validate and release versions

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!website/**'
      - '!.github/workflows/website.yml'
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!website/**'
      - '!.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

# Serialize the whole pipeline, including promotion of all update channels.
concurrency:
  group: versions-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate workflow syntax and expressions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes=

  versions:
    runs-on: ubuntu-latest
    outputs:
      noodle: ${{ steps.versions.outputs.noodle }}
      computer: ${{ steps.versions.outputs.computer }}
      applet: ${{ steps.versions.outputs.applet }}
      browser: ${{ steps.versions.outputs.browser }}
      hub: ${{ steps.versions.outputs.hub }}
      mobile: ${{ steps.versions.outputs.mobile }}
      images: ${{ steps.versions.outputs.images }}
      any: ${{ steps.versions.outputs.any }}
      products: ${{ steps.versions.outputs.products }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: versions
        run: python3 scripts/release-versions.py plan
      - name: Require public distribution
        if: github.event_name != 'pull_request' && steps.versions.outputs.any == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = false

  checks:
    needs: [workflow-lint, versions]
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Verify version automation and publication guards
        run: |
          python3 -m unittest discover -s Tests/ReleaseAutomation -v
          python3 -m unittest discover -s Tests/CoverageReporting -v
          swift Tests/ReleaseAutomation/PublishReleaseTests.swift "$PWD"
      - name: Verify app icons match their symbols
        run: zsh scripts/verify-icons.sh

  test-noodle:
    needs: [versions, checks]
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Build sandbox CLI fixtures without signing credentials
        run: zsh Tests/build-sandbox-cli-fixture.sh
      - name: Test shared wallpaper imports and preview drops
        run: swift test --disable-sandbox --package-path Shared/Wallpaper --scratch-path .build/wallpaper
      - name: Test settings window behavior
        run: swift test --disable-sandbox --package-path Shared/SettingsUI --scratch-path .build/settings-ui
      - name: Test launch check matching
        run: swift test --disable-sandbox --package-path Shared/LaunchChecks --scratch-path .build/launch-checks
      - name: Test Noodle and Computer integration
        id: tests
        env:
          NOODLE_TEST_CLI_APPLICATION: ${{ github.workspace }}/.build/Sandbox CLI Tests.app
        run: swift test --disable-sandbox --enable-code-coverage
      - name: Summarize Noodle coverage
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: |
          coverage_path="$(swift test --disable-sandbox --show-codecov-path)"
          python3 scripts/coverage-report.py --input "$coverage_path" --output .build/coverage/noodle
          cat .build/coverage/noodle/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Noodle coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: noodle-coverage
          path: .build/coverage/noodle/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  test-noodle-macos27:
    needs: [versions, checks]
    # The image releases use: macOS 27 with Xcode 27, so the Apple harness is compiled in and runs.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Prepare Metal tools
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Test settings resizing on macOS 27
        run: swift test --disable-sandbox --package-path Shared/SettingsUI --scratch-path .build/settings-ui
      - name: Build and test the macOS 27 harness
        shell: zsh {0}
        env:
          # Only the harness and its tests; the app is tested on macOS 26 above.
          NOODLE_APPLE_HARNESS_ONLY: '1'
        run: |
          set -euo pipefail
          swift build --disable-sandbox
          bin_path="$(swift build --disable-sandbox --show-bin-path)"
          zsh scripts/build-mlx-metal.sh "$bin_path"
          "$bin_path/NoodleAppleAgent" --inspect > .build/inspection.json
          python3 -c 'import json; data = json.load(open(".build/inspection.json")); assert data.get("localModelsSupported") is True, "macOS 27 support was compiled out"'
          export NOODLE_APPLE_TEST_HELPER="$bin_path/NoodleAppleAgent"
          swift test --disable-sandbox --filter 'AppleLocalModelsTests|AppleModelDownloaderTests|NoodleAppleRuntimeTests'
          print 'macOS 27 harness build, Metal shaders, and regression tests passed. Live inference remains an explicit local opt-in.' >> "$GITHUB_STEP_SUMMARY"

  test-computer:
    needs: [versions, checks]
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Test Computer
        run: swift test --disable-sandbox --package-path Computer --scratch-path .build/computer
      - name: Test Local Mac account boundaries and update recovery
        run: swift test --disable-sandbox --package-path Computer/LocalMac --scratch-path .build/localmac

  test-applet:
    needs: [versions, checks]
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Test Applet
        run: swift test --disable-sandbox --package-path Applet --scratch-path .build/applet

  test-bridge:
    needs: [versions, checks]
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Test the shared protocol
        run: swift test --disable-sandbox --package-path Computer/Bridge

  test-browser:
    needs: [versions, checks]
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Test Browser
        run: swift test --disable-sandbox --package-path Browser --scratch-path .build/browser

  test-hub:
    needs: [versions, checks]
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Test Hub
        run: swift test --disable-sandbox --package-path Hub --scratch-path .build/hub

  test-mobile:
    needs: [versions, checks]
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Test Mobile on an iPhone simulator
        run: zsh scripts/mobile.sh test

  # Each preparation waits only for its own product's tests, so a companion is not signed
  # behind Noodle's long suite. The tag job below still requires every selected test.
  prepare-noodle:
    needs: [versions, checks, test-noodle, test-noodle-macos27, test-bridge]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.versions.outputs.noodle == 'true'
    uses: ./.github/workflows/prepare-noodle-release.yml
    secrets: inherit

  prepare-computer:
    needs: [versions, checks, test-computer, test-bridge]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.versions.outputs.computer == 'true'
    uses: ./.github/workflows/computer-release.yml
    secrets: inherit

  prepare-applet:
    needs: [versions, checks, test-applet]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.versions.outputs.applet == 'true'
    uses: ./.github/workflows/applet-release.yml
    secrets: inherit

  prepare-images:
    needs: [versions, checks]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.versions.outputs.images == 'true'
    uses: ./.github/workflows/computer-images.yml

  prepare-browser:
    needs: [versions, checks, test-browser]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.versions.outputs.browser == 'true'
    uses: ./.github/workflows/browser-release.yml
    secrets: inherit

  # The Hub ships Noodle's runtime and helpers, so it also waits for Noodle's own tests.
  prepare-hub:
    needs: [versions, checks, test-hub, test-noodle]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.versions.outputs.hub == 'true'
    uses: ./.github/workflows/hub-release.yml
    secrets: inherit

  prepare-mobile:
    needs: [versions, checks, test-mobile]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.versions.outputs.mobile == 'true'
    uses: ./.github/workflows/mobile-release.yml
    secrets: inherit

  tag:
    needs: [versions, workflow-lint, checks, test-noodle, test-noodle-macos27, test-computer, test-applet, test-browser, test-hub, test-mobile, test-bridge, prepare-noodle, prepare-computer, prepare-applet, prepare-browser, prepare-hub, prepare-mobile, prepare-images]
    # Explicitly accept unselected/skipped products, never a failed/cancelled build.
    if: >-
      always() && !cancelled() && github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' && needs.versions.outputs.any == 'true' &&
      needs.workflow-lint.result == 'success' &&
      needs.checks.result == 'success' &&
      ((needs.versions.outputs.noodle != 'true' && needs.versions.outputs.computer != 'true' && needs.versions.outputs.applet != 'true' && needs.versions.outputs.browser != 'true' && needs.versions.outputs.hub != 'true') ||
       (needs.test-noodle.result == 'success' && needs.test-bridge.result == 'success')) &&
      (needs.versions.outputs.computer != 'true' || needs.test-computer.result == 'success') &&
      (needs.versions.outputs.applet != 'true' || needs.test-applet.result == 'success') &&
      (needs.versions.outputs.browser != 'true' || needs.test-browser.result == 'success') &&
      (needs.versions.outputs.hub != 'true' || needs.test-hub.result == 'success') &&
      (needs.versions.outputs.mobile != 'true' || needs.test-mobile.result == 'success') &&
      (needs.versions.outputs.noodle != 'true' || needs.test-noodle-macos27.result == 'success') &&
      (needs.versions.outputs.noodle != 'true' || needs.prepare-noodle.result == 'success') &&
      (needs.versions.outputs.computer != 'true' || needs.prepare-computer.result == 'success') &&
      (needs.versions.outputs.applet != 'true' || needs.prepare-applet.result == 'success') &&
      (needs.versions.outputs.browser != 'true' || needs.prepare-browser.result == 'success') &&
      (needs.versions.outputs.hub != 'true' || needs.prepare-hub.result == 'success') &&
      (needs.versions.outputs.mobile != 'true' || needs.prepare-mobile.result == 'success') &&
      (needs.versions.outputs.images != 'true' || needs.prepare-images.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Mint tags from the checked VERSION files
        env:
          RELEASE_PRODUCTS: ${{ needs.versions.outputs.products }}
        run: |
          git fetch origin --tags
          python3 scripts/release-versions.py tag

  publish-images:
    needs: [versions, tag]
    if: >-
      always() && !cancelled() && needs.tag.result == 'success' &&
      needs.versions.outputs.images == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: computer-image-builds
      - name: Load the tested images
        run: |
          sha256sum -c computer-images.tar.gz.sha256
          docker load < computer-images.tar.gz
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and verify public versioned and latest images
        run: bash scripts/publish-computer-images.sh
      - uses: actions/upload-artifact@v6
        with:
          name: computer-image-digests
          path: computer-image-digests.txt
          if-no-files-found: error

  publish-computer:
    needs: [versions, tag, publish-images]
    if: >-
      always() && !cancelled() && needs.tag.result == 'success' &&
      needs.versions.outputs.computer == 'true' &&
      (needs.versions.outputs.images != 'true' || needs.publish-images.result == 'success')
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Read Computer version
        run: echo "COMPUTER_VERSION=$(cat Computer/VERSION)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v7
        with:
          name: computer-release-assets
          path: dist/computer-${{ env.COMPUTER_VERSION }}
      - name: Verify public image channel before releasing Computer
        run: python3 scripts/computer-image-registry.py channel
      - name: Publish the verified Computer archive and update channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "dist/computer-$COMPUTER_VERSION"
          shasum -a 256 -c Noodle-Computer-arm64.zip.sha256
          shasum -a 256 -c Noodle-Computer-arm64.dmg.sha256
          cd ../..
          zsh scripts/publish-xcode-release.sh Computer "$COMPUTER_VERSION" "dist/computer-$COMPUTER_VERSION/release-notes.md"

  publish-applet:
    needs: [versions, tag]
    if: >-
      always() && !cancelled() && needs.tag.result == 'success' &&
      needs.versions.outputs.applet == 'true'
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Read Applet version
        run: echo "APPLET_VERSION=$(cat Applet/VERSION)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v7
        with:
          name: applet-release-assets
          path: dist/applet-${{ env.APPLET_VERSION }}
      - name: Publish the verified Applet archive and update channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "dist/applet-$APPLET_VERSION"
          shasum -a 256 -c Noodle-Applet-arm64.zip.sha256
          shasum -a 256 -c Noodle-Applet-arm64.dmg.sha256
          cd ../..
          zsh scripts/publish-xcode-release.sh Applet "$APPLET_VERSION" "dist/applet-$APPLET_VERSION/release-notes.md"

  publish-browser:
    needs: [versions, tag]
    if: >-
      always() && !cancelled() && needs.tag.result == 'success' &&
      needs.versions.outputs.browser == 'true'
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Read Browser version
        run: echo "BROWSER_VERSION=$(cat Browser/VERSION)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v7
        with:
          name: browser-release-assets
          path: dist/browser-${{ env.BROWSER_VERSION }}
      - name: Publish the verified Browser archive and update channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "dist/browser-$BROWSER_VERSION"
          shasum -a 256 -c Noodle-Browser-arm64.zip.sha256
          shasum -a 256 -c Noodle-Browser-arm64.dmg.sha256
          cd ../..
          zsh scripts/publish-xcode-release.sh Browser "$BROWSER_VERSION" "dist/browser-$BROWSER_VERSION/release-notes.md"

  publish-hub:
    needs: [versions, tag]
    if: >-
      always() && !cancelled() && needs.tag.result == 'success' &&
      needs.versions.outputs.hub == 'true'
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Read Hub version
        run: echo "HUB_VERSION=$(cat Hub/VERSION)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v7
        with:
          name: hub-release-assets
          path: dist/hub-${{ env.HUB_VERSION }}
      - name: Publish the verified Hub archive and update channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "dist/hub-$HUB_VERSION"
          shasum -a 256 -c Noodle-Hub-arm64.zip.sha256
          shasum -a 256 -c Noodle-Hub-arm64.dmg.sha256
          cd ../..
          zsh scripts/publish-xcode-release.sh Hub "$HUB_VERSION" "dist/hub-$HUB_VERSION/release-notes.md"

  # TestFlight is the phone app's release channel; automatic distribution hands each build to testers.
  publish-mobile:
    needs: [versions, tag]
    if: >-
      always() && !cancelled() && needs.tag.result == 'success' &&
      needs.versions.outputs.mobile == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Read Mobile version
        run: echo "MOBILE_VERSION=$(cat Mobile/VERSION)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v7
        with:
          name: mobile-release-assets
          path: dist/mobile-${{ env.MOBILE_VERSION }}
      - name: Upload the verified app to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        shell: zsh {0}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/mobile-upload.p8"
          trap 'rm -f "$key"' EXIT
          print -rn -- "${APP_STORE_CONNECT_API_KEY_P8:?Missing App Store Connect key}" > "$key"
          APPLE_API_KEY_PATH="$key" APPLE_API_KEY_ID="$APP_STORE_CONNECT_KEY_ID" \
            APPLE_API_ISSUER_ID="$APP_STORE_CONNECT_ISSUER_ID" \
            zsh scripts/mobile.sh upload "dist/mobile-$MOBILE_VERSION/Noodle-Mobile.ipa"

  publish-noodle:
    needs: [versions, tag, publish-images, publish-computer, publish-applet, publish-browser]
    if: >-
      always() && !cancelled() && needs.tag.result == 'success' &&
      needs.versions.outputs.noodle == 'true' &&
      (needs.versions.outputs.images != 'true' || needs.publish-images.result == 'success') &&
      (needs.versions.outputs.computer != 'true' || needs.publish-computer.result == 'success') &&
      (needs.versions.outputs.applet != 'true' || needs.publish-applet.result == 'success') &&
      (needs.versions.outputs.browser != 'true' || needs.publish-browser.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: noodle-release-assets
          path: dist
      - name: Publish the verified Noodle archive and update channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          tag="v$version"
          cd dist
          sha256sum -c Noodle-arm64.zip.sha256
          sha256sum -c Noodle-arm64.dmg.sha256
          cd ..
          # Existing releases (including drafts) require recovery, never replacement.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists; inspect it before retrying." >&2
            exit 1
          fi
          gh release create "$tag" dist/Noodle-arm64.zip \
            dist/Noodle-arm64.zip.sha256 dist/appcast.xml \
            dist/Noodle-arm64.dmg dist/Noodle-arm64.dmg.sha256 \
            --draft --verify-tag --notes-file dist/release-notes.md --title "Noodle $version"
          gh release edit "$tag" --draft=false --latest

  complete:
    needs: [versions, tag, publish-images, publish-computer, publish-applet, publish-browser, publish-hub, publish-mobile, publish-noodle]
    if: always() && github.event_name != 'pull_request' && needs.versions.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected product to be published
        env:
          RELEASE_PRODUCTS: ${{ needs.versions.outputs.products }}
          IMAGES_RESULT: ${{ needs.publish-images.result }}
          COMPUTER_RESULT: ${{ needs.publish-computer.result }}
          APPLET_RESULT: ${{ needs.publish-applet.result }}
          BROWSER_RESULT: ${{ needs.publish-browser.result }}
          HUB_RESULT: ${{ needs.publish-hub.result }}
          MOBILE_RESULT: ${{ needs.publish-mobile.result }}
          NOODLE_RESULT: ${{ needs.publish-noodle.result }}
        run: |
          python3 - <<'PY'
          import json, os
          for product in json.loads(os.environ['RELEASE_PRODUCTS']):
              result = os.environ[product.upper() + '_RESULT']
              if result != 'success':
                  raise SystemExit(f'{product} publication did not complete: {result}')
          print('Every selected product was published successfully.')
          PY
