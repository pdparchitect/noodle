name: Publish verified release artifacts
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed release run whose verified artifacts should be published
        required: true
        type: string
permissions:
  actions: read
  contents: write
  packages: write
concurrency:
  group: versions-main
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install publication shell
        run: sudo apt-get update -qq && sudo apt-get install -y zsh
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish original verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARED_RUN_ID: ${{ inputs.run_id }}
        run: python3 scripts/publish-prepared-release.py "$PREPARED_RUN_ID"
