name: Rook computer images

# Rook's Shell and Desktop images are Noodle Computer's on Kali's base, with Rook's banner and wallpaper from
# Incubator/Rook/Images/brand: the Desktop from Computer/Images, the Shell from Incubator/Rook/Images/shell. They are
# versioned on their own, never with Noodle's images, and run the same checks. A dated section for
# Incubator/Rook/Images/VERSION in its CHANGELOG.md, pushed to main, publishes that version once its checks pass. A pull
# request only checks; a manual run checks, and publishes an unreleased dated version when asked.
on:
  push:
    branches: [main]
    paths:
      - 'Incubator/Rook/Images/VERSION'
      - 'Incubator/Rook/Images/CHANGELOG.md'
  pull_request:
    paths:
      - 'Incubator/Rook/Images/**'
      - 'Computer/Images/**'
      - 'scripts/publish-computer-images.sh'
      - 'scripts/computer-image-registry.py'
      - '.github/workflows/rook-images.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the checked images as the dated, unreleased version in Incubator/Rook/Images/VERSION and as latest
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rook-images-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_PREFIX: rook-computer
  IMAGE_VERSION_FILE: Incubator/Rook/Images/VERSION
  # Kali's rolling base, pinned; both images start from it.
  KALI_IMAGE: docker.io/kalilinux/kali-rolling@sha256:69a9a33d98a584a537bd0f7144d20c3b6d23f3bafa9ffcf0cadf4c5f186d02ff

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      # Publish only from main: on a push, or a manual run that asks.
      publish: ${{ steps.plan.outputs.release == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: plan
        name: Find an unreleased, dated version of Rook's images
        run: python3 scripts/release-versions.py pending rook-images

  build:
    needs: plan
    # A push that releases nothing has nothing to check.
    if: github.event_name != 'push' || needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: docker/setup-buildx-action@v4
      - name: Validate image version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < "$IMAGE_VERSION_FILE")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Build both ARM64 images with Rook's brand
        id: build
        env:
          IMAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -eu
          for kind in shell desktop; do
            dockerfile="Computer/Images/$kind/Dockerfile"
            [ "$kind" = desktop ] || dockerfile="Incubator/Rook/Images/$kind/Dockerfile"
            docker buildx build --platform linux/arm64 --load \
              --build-arg IMAGE_VERSION="$IMAGE_VERSION" --build-arg SOURCE_REVISION="$GITHUB_SHA" \
              --build-arg IMAGE_PRODUCT="Rook" --build-arg DESKTOP_BRAND="Rook" \
              --build-arg KALI_IMAGE="$KALI_IMAGE" --build-arg BASE_IMAGE="$KALI_IMAGE" \
              --build-context brand=Incubator/Rook/Images/brand \
              --tag "$IMAGE_PREFIX-$kind-image:check" --file "$dockerfile" Computer/Images
          done
      # Computer copies the Shell onto a 256 MB disk to set up every computer's network.
      - name: Keep the Shell small enough to set up networking
        # Every check runs once both images built, so one run reports every failure; publishing still needs all to pass.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -eu
          size="$(docker image inspect --format '{{.Size}}' "$IMAGE_PREFIX-shell-image:check")"
          echo "Shell image: $((size / 1048576)) MB"
          [ "$size" -lt $((200 * 1048576)) ]
      - name: Verify both image contracts without networking or host mounts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -eu
          for kind in shell desktop; do
            docker run --rm --network none --entrypoint /bin/sh "$IMAGE_PREFIX-$kind-image:check" /usr/local/lib/noodle-image-check "$kind"
          done
      - name: Verify desktop startup and extension hooks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: docker run --rm -i --user root --network none --entrypoint /bin/bash "$IMAGE_PREFIX-desktop-image:check" < Computer/Images/tests/startup.sh
      - name: Verify Rook's interactive welcome in both images
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          WELCOME_MARK: R O O K
          WELCOME_ART: '   (_________)'
          WELCOME_TAGLINE: Autonomous AI red team.
        run: python3 Computer/Images/tests/welcome.py docker "$IMAGE_PREFIX-shell-image:check" "$IMAGE_PREFIX-desktop-image:check"
      - name: Verify non-root defaults and explicit sudo in both images
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -eu
          for kind in shell desktop; do
            docker run --rm -i --network none --entrypoint /bin/sh "$IMAGE_PREFIX-$kind-image:check" < Computer/Images/tests/user.sh
          done
      - name: Verify desktop and Chromium frame rendering
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: docker run --rm -i --network none --entrypoint /bin/sh "$IMAGE_PREFIX-desktop-image:check" < Computer/Images/tests/desktop.sh
      - name: Verify file helper account transition
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 Computer/Images/tests/file-user.py docker "$IMAGE_PREFIX-shell-image:check" "$IMAGE_PREFIX-desktop-image:check"
      - name: Verify visible browser automation and persistent sign-in
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: docker run --rm -i --user root --network none --entrypoint /bin/bash "$IMAGE_PREFIX-desktop-image:check" < Computer/Images/tests/browser.sh
      # Export the exact tested builds. Publication loads these; it never rebuilds.
      - name: Save tested images
        if: needs.plan.outputs.publish == 'true'
        run: |
          set -eu
          docker save "$IMAGE_PREFIX-shell-image:check" "$IMAGE_PREFIX-desktop-image:check" | gzip > rook-images.tar.gz
          sha256sum rook-images.tar.gz > rook-images.tar.gz.sha256
      - uses: actions/upload-artifact@v6
        if: needs.plan.outputs.publish == 'true'
        with:
          name: rook-image-builds
          path: |
            rook-images.tar.gz
            rook-images.tar.gz.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Tag the released images
        env:
          RELEASE_PRODUCTS: '["rook-images"]'
        run: |
          git fetch origin --tags
          python3 scripts/release-versions.py tag
      - uses: actions/download-artifact@v7
        with:
          name: rook-image-builds
      - name: Load the tested images
        run: |
          sha256sum -c rook-images.tar.gz.sha256
          docker load < rook-images.tar.gz
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and verify public versioned and latest images
        run: bash scripts/publish-computer-images.sh
      - uses: actions/upload-artifact@v6
        with:
          name: rook-image-digests
          path: computer-image-digests.txt
          if-no-files-found: error
