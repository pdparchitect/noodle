name: Offer Noodle Mobile to public testers

# Runs after the whole release succeeded, apart from it, so waiting for Apple never holds back the
# Suite. Every later successful run on main tries again, so fixing a failure and pushing finishes it.
on:
  workflow_run:
    workflows: [Validate and release versions, Publish verified release artifacts]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  external:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Hand the build to the External group and beta review
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/testflight.p8"
          trap 'rm -f "$key"' EXIT
          printf '%s' "${APP_STORE_CONNECT_API_KEY_P8:?Missing App Store Connect key}" > "$key"
          APPLE_API_KEY_PATH="$key" APPLE_API_KEY_ID="$APP_STORE_CONNECT_KEY_ID" \
            APPLE_API_ISSUER_ID="$APP_STORE_CONNECT_ISSUER_ID" \
            python3 scripts/testflight.py
