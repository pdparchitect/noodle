name: Release Rook

# Rook is incubating and releases on its own: never with Noodle, its suite or its companions. A dated
# section for Incubator/Rook/VERSION in Incubator/Rook/CHANGELOG.md, pushed to main, releases that
# version on the rook-latest update channel. It can also be started by hand.
on:
  push:
    branches: [main]
    paths:
      - 'Incubator/Rook/VERSION'
      - 'Incubator/Rook/CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rook-release
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: plan
        name: Find an unreleased, dated Rook version
        run: python3 scripts/release-versions.py pending rook

  test:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: xcode-27
    # The image defaults to Xcode 27.1, whose builds broke Pion 0.12.0's text fields; 27.2 builds them correctly.
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Test RookCore
        run: swift test --disable-sandbox --package-path Incubator/Rook --scratch-path .build/rook
      - name: Test the Rook app
        shell: zsh {0}
        run: |
          set -euo pipefail
          tuist="$(zsh scripts/install-tuist.sh)"
          (cd Incubator/Rook && "$tuist" generate --no-open)
          xcodebuild -workspace Incubator/Rook/Rook.xcworkspace -scheme RookAppTests -derivedDataPath .build/rook-tests \
            -destination 'platform=macOS' ARCHS=arm64 -skipPackagePluginValidation -skipMacroValidation test

  release:
    needs: [plan, test]
    # Rook ships the Apple harness with compiled MLX shaders, so it builds as Noodle and the Hub do.
    runs-on: xcode-27
    # The image defaults to Xcode 27.1, whose builds broke Pion 0.12.0's text fields; 27.2 builds them correctly.
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Require the macOS 27 SDK and prepare Metal tools
        shell: zsh {0}
        run: |
          set -euo pipefail
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          [[ "${sdk_version%%.*}" -ge 27 ]] || { print -u2 "Rook releases require SDK 27 or later; found $sdk_version"; exit 1; }
          xcodebuild -downloadComponent MetalToolchain

      # Rook runs Noodle Computer's engine, which ships the Linux guest file helper built from Go.
      - name: Set up Go for the guest file helper
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false

      - name: Validate public release and notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: zsh {0}
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" == false ]] || {
            print -u2 'Public downloads and unauthenticated updates require a public repository.'; exit 1
          }
          print "ROOK_VERSION=${{ needs.plan.outputs.version }}" >> "$GITHUB_ENV"
          python3 scripts/release-versions.py notes rook > "$RUNNER_TEMP/rook-notes.md"

      - name: Prepare signing credentials
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        shell: zsh {0}
        run: |
          set -euo pipefail
          : "${MACOS_CERTIFICATE_P12:?Missing certificate}"
          : "${MACOS_CERTIFICATE_PASSWORD:?Missing certificate password}"
          : "${APP_STORE_CONNECT_API_KEY_P8:?Missing notarization key}"
          : "${APP_STORE_CONNECT_KEY_ID:?Missing notarization key ID}"
          : "${APP_STORE_CONNECT_ISSUER_ID:?Missing notarization issuer}"
          : "${SPARKLE_PRIVATE_KEY:?Missing update signing key}"
          umask 077
          keychain="$RUNNER_TEMP/rook-signing.keychain-db"
          password="$(openssl rand -base64 32)"
          print -rn -- "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/rook-signing.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/rook-signing.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F '"' '/Developer ID Application:/ { print $2; exit }')"
          [[ -n "$identity" ]]
          print -rn -- "$APP_STORE_CONNECT_API_KEY_P8" > "$RUNNER_TEMP/rook-notary.p8"
          print -rn -- "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/rook-update.key"
          print "NOODLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          print "APPLE_API_KEY_PATH=$RUNNER_TEMP/rook-notary.p8" >> "$GITHUB_ENV"
          print "APPLE_API_KEY_ID=$APP_STORE_CONNECT_KEY_ID" >> "$GITHUB_ENV"
          print "APPLE_API_ISSUER_ID=$APP_STORE_CONNECT_ISSUER_ID" >> "$GITHUB_ENV"
          print "SPARKLE_PRIVATE_KEY_PATH=$RUNNER_TEMP/rook-update.key" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, staple and sign update feed
        shell: zsh {0}
        run: zsh scripts/package-xcode-release.sh Rook "rook-v$ROOK_VERSION"

      - name: Save verified release assets
        run: cp "$RUNNER_TEMP/rook-notes.md" "dist/rook-$ROOK_VERSION/release-notes.md"

      - uses: actions/upload-artifact@v6
        with:
          name: rook-release-assets
          path: dist/rook-${{ env.ROOK_VERSION }}/
          if-no-files-found: error
          retention-days: 7

      - name: Remove ephemeral signing credentials
        if: always()
        shell: zsh {0}
        run: |
          rm -f "$RUNNER_TEMP/rook-signing.p12" "$RUNNER_TEMP/rook-notary.p8" "$RUNNER_TEMP/rook-update.key"
          if [[ -f "$RUNNER_TEMP/rook-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/rook-signing.keychain-db"
          fi

  publish:
    needs: [plan, release]
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Tag the released commit
        env:
          RELEASE_PRODUCTS: '["rook"]'
        run: |
          git fetch origin --tags
          python3 scripts/release-versions.py tag
      - uses: actions/download-artifact@v7
        with:
          name: rook-release-assets
          path: dist/rook-${{ needs.plan.outputs.version }}
      - name: Publish the verified Rook archive and update channel
        env:
          GH_TOKEN: ${{ github.token }}
          ROOK_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          cd "dist/rook-$ROOK_VERSION"
          shasum -a 256 -c Rook-arm64.zip.sha256
          shasum -a 256 -c Rook-arm64.dmg.sha256
          cd ../..
          zsh scripts/publish-xcode-release.sh Rook "$ROOK_VERSION" "dist/rook-$ROOK_VERSION/release-notes.md"
