name: Prepare Noodle Server release

on:
  workflow_call:

permissions:
  contents: read

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate public release and notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < Server/VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -Eq "^## \\[$version\\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" Server/CHANGELOG.md
          [[ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" == false ]] || {
            echo 'Public downloads require a public repository.' >&2; exit 1
          }
          mkdir -p "dist/server-$version"
          python3 scripts/release-versions.py notes server > "dist/server-$version/release-notes.md"

      - uses: actions/upload-artifact@v6
        with:
          name: server-release-notes
          path: dist/
          if-no-files-found: error
          retention-days: 7

  build:
    strategy:
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    # The toolchain image Noodle Push builds with.
    container: swift:6.4.1-noble@sha256:19cbe56bdaec1918f7cf5fdeba42b9bd55bdd8a6149c9990d0e0e3a89a127d63
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install SQLite's headers
        run: apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev

      - name: Build and pack
        run: bash scripts/package-server-release.sh

      - uses: actions/upload-artifact@v6
        with:
          name: server-release-${{ matrix.runner }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # noodled for the Mac, signed with Developer ID and notarized.
  macos:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare signing credentials
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        shell: zsh {0}
        run: |
          set -euo pipefail
          : "${MACOS_CERTIFICATE_P12:?Missing certificate}"
          : "${MACOS_CERTIFICATE_PASSWORD:?Missing certificate password}"
          : "${APP_STORE_CONNECT_API_KEY_P8:?Missing notarization key}"
          : "${APP_STORE_CONNECT_KEY_ID:?Missing notarization key ID}"
          : "${APP_STORE_CONNECT_ISSUER_ID:?Missing notarization issuer}"
          umask 077
          keychain="$RUNNER_TEMP/server-signing.keychain-db"
          password="$(openssl rand -base64 32)"
          print -rn -- "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/server-signing.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/server-signing.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F '"' '/Developer ID Application:/ { print $2; exit }')"
          [[ -n "$identity" ]]
          print -rn -- "$APP_STORE_CONNECT_API_KEY_P8" > "$RUNNER_TEMP/server-notary.p8"
          print "NOODLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          print "APPLE_API_KEY_PATH=$RUNNER_TEMP/server-notary.p8" >> "$GITHUB_ENV"
          print "APPLE_API_KEY_ID=$APP_STORE_CONNECT_KEY_ID" >> "$GITHUB_ENV"
          print "APPLE_API_ISSUER_ID=$APP_STORE_CONNECT_ISSUER_ID" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        shell: zsh {0}
        run: zsh scripts/package-server-macos-release.sh

      - uses: actions/upload-artifact@v6
        with:
          name: server-release-macos
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Remove ephemeral signing credentials
        if: always()
        shell: zsh {0}
        run: |
          rm -f "$RUNNER_TEMP/server-signing.p12" "$RUNNER_TEMP/server-notary.p8"
          if [[ -f "$RUNNER_TEMP/server-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/server-signing.keychain-db"
          fi

  # noodled for Windows, one ZIP for each processor.
  windows:
    strategy:
      matrix:
        runner: [windows-11-arm, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Swift
        shell: pwsh
        run: ./scripts/install-swift-windows.ps1

      - name: Build and pack
        shell: pwsh
        run: ./scripts/package-server-windows-release.ps1

      - uses: actions/upload-artifact@v6
        with:
          name: server-release-windows-${{ matrix.runner }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
